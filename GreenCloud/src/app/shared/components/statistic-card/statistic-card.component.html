<div class="stat-card" appReveal>
  <div class="stat-card__value">
    <span [appCountUp]="numericValue()">{{ value() }}</span><span class="stat-card__suffix">{{ suffix() }}</span>
  </div>
  <div class="stat-card__label">{{ label() }}</div>
  @if (description()) {
    <div class="stat-card__desc">{{ description() }}</div>
  }
</div>
